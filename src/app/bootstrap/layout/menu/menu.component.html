<!-- @autogenerated -->
<div style="display: flex; flex-direction: row; align-items: center">
  <img src="./assets/img/logo-75x75.png" style="width: 75px; height: 75px" alt="Phylax" /> PHYLAX
</div>
<mat-nav-list>
  @for (item of menu(); track $index) {
    <ng-template [ngTemplateOutlet]="menuTemplate" [ngTemplateOutletContext]="{ $implicit: $any(item) }"></ng-template>
  }
</mat-nav-list>

<ng-template #menuTemplate let-item>
  @if (!item.hidden && item.childs && item.childs.length > 0) {
    <h3 matSubheader>{{ item.label }}</h3>
    @for (citem of item.childs; track $index) {
      <ng-template
        [ngTemplateOutlet]="menuTemplate"
        [ngTemplateOutletContext]="{ $implicit: $any(citem) }"
      ></ng-template>
    }
  }
  @if (!item.hidden && (!item.childs || item.childs.length == 0)) {
    <a mat-list-item [activated]="item.active" (click)="run(item, $event)">{{ item.label }}</a>
  }
</ng-template>
