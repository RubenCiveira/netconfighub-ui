<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="infrastructure.config-template.search.search"
  />
  <editable-text
    formControlName="name"
    [visible]="isVisible['name']"
    label="infrastructure.config-template.search.name"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="infrastructure.config-template.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
