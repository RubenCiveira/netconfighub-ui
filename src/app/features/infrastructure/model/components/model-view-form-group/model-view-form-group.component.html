<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="infrastructure.model.form-group.name" />
  <editable-selectone
    formControlName="vendor"
    [visible]="isVisible['vendor']"
    label="infrastructure.model.form-group.vendor"
    [provider]="vendorProvider"
  />
  <editable-selectone
    formControlName="type"
    [visible]="isVisible['type']"
    label="infrastructure.model.form-group.type"
    [provider]="typeProvider"
  />
</form-layout>
