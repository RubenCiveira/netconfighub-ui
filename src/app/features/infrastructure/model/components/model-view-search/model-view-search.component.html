<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="infrastructure.model.search.search" />
  <editable-selectone
    formControlName="types"
    [visible]="isVisible['types']"
    label="infrastructure.model.search.types"
    [provider]="typesProvider"
  />
  <editable-selectone
    formControlName="vendor"
    [visible]="isVisible['vendor']"
    label="infrastructure.model.search.vendor"
    [provider]="vendorProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="infrastructure.model.search.name" />
  <editable-selectone
    formControlName="type"
    [visible]="isVisible['type']"
    label="infrastructure.model.search.type"
    [provider]="typeProvider"
  />
  <editable-selectone
    formControlName="vendors"
    [visible]="isVisible['vendors']"
    label="infrastructure.model.search.vendors"
    [provider]="vendorsProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="infrastructure.model.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
