<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="site"
    [visible]="isVisible['site']"
    label="installations.project.form-group.site"
    [provider]="siteProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="installations.project.form-group.name" />
  <editable-text
    formControlName="description"
    [visible]="isVisible['description']"
    label="installations.project.form-group.description"
  />
  <editable-choose
    formControlName="operationMode"
    [visible]="isVisible['operationMode']"
    label="installations.project.form-group.operation-mode"
    [options]="['SINGLE', 'DOUBLE']"
  />
  <editable-datetime
    formControlName="plannedAt"
    [visible]="isVisible['plannedAt']"
    label="installations.project.form-group.planned-at"
  />
  <editable-datetime
    formControlName="plannedConfigAt"
    [visible]="isVisible['plannedConfigAt']"
    label="installations.project.form-group.planned-config-at"
  />
  <editable-choose
    formControlName="status"
    [visible]="isVisible['status']"
    label="installations.project.form-group.status"
    [options]="['DRAFT', 'PLANNED', 'IN-PROGRESS', 'COMPLETED']"
  />
</form-layout>
