<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="result"
    [visible]="isVisible['result']"
    label="installations.device-check.search.result"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="installations.device-check.search.search"
  />
  <editable-selectone
    formControlName="projectDevices"
    [visible]="isVisible['projectDevices']"
    label="installations.device-check.search.project-devices"
    [provider]="projectDevicesProvider"
  />
  <editable-selectone
    formControlName="projectDevice"
    [visible]="isVisible['projectDevice']"
    label="installations.device-check.search.project-device"
    [provider]="projectDeviceProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="installations.device-check.search.order"
    [options]="['', 'RESULT-ASC', 'RESULT-DESC']"
  />
</form-layout>
