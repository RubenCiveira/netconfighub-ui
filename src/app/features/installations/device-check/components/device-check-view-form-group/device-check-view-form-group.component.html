<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="projectDevice"
    [visible]="isVisible['projectDevice']"
    label="installations.device-check.form-group.project-device"
    [provider]="projectDeviceProvider"
  />
  <editable-choose
    formControlName="result"
    [visible]="isVisible['result']"
    label="installations.device-check.form-group.result"
    [options]="['PASS', 'FAIL']"
  />
  <editable-text
    formControlName="details"
    [visible]="isVisible['details']"
    label="installations.device-check.form-group.details"
  />
  <editable-datetime
    formControlName="checkedAt"
    [visible]="isVisible['checkedAt']"
    label="installations.device-check.form-group.checked-at"
  />
  <editable-text
    formControlName="checkedBy"
    [visible]="isVisible['checkedBy']"
    label="installations.device-check.form-group.checked-by"
  />
</form-layout>
