<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="name"
    [visible]="isVisible['name']"
    label="installations.project-device.form-group.name"
  />
  <editable-selectone
    formControlName="project"
    [visible]="isVisible['project']"
    label="installations.project-device.form-group.project"
    [provider]="projectProvider"
  />
  <editable-selectone
    formControlName="floor"
    [visible]="isVisible['floor']"
    label="installations.project-device.form-group.floor"
    [provider]="floorProvider"
  />
  <editable-selectone
    formControlName="type"
    [visible]="isVisible['type']"
    label="installations.project-device.form-group.type"
    [provider]="typeProvider"
  />
  <editable-selectone
    formControlName="model"
    [visible]="isVisible['model']"
    label="installations.project-device.form-group.model"
    [provider]="modelProvider"
  />
  <editable-selectone
    formControlName="configTemplate"
    [visible]="isVisible['configTemplate']"
    label="installations.project-device.form-group.config-template"
    [provider]="configTemplateProvider"
  />
  <editable-decimal
    formControlName="posX"
    [visible]="isVisible['posX']"
    label="installations.project-device.form-group.pos-x"
  />
  <editable-decimal
    formControlName="posY"
    [visible]="isVisible['posY']"
    label="installations.project-device.form-group.pos-y"
  />
</form-layout>
