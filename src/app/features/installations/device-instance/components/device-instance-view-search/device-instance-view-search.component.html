<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="models"
    [visible]="isVisible['models']"
    label="installations.device-instance.search.models"
    [provider]="modelsProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="installations.device-instance.search.search"
  />
  <editable-text
    formControlName="serialNumber"
    [visible]="isVisible['serialNumber']"
    label="installations.device-instance.search.serial-number"
  />
  <editable-selectone
    formControlName="projectDevices"
    [visible]="isVisible['projectDevices']"
    label="installations.device-instance.search.project-devices"
    [provider]="projectDevicesProvider"
  />
  <editable-selectone
    formControlName="model"
    [visible]="isVisible['model']"
    label="installations.device-instance.search.model"
    [provider]="modelProvider"
  />
  <editable-selectone
    formControlName="projectDevice"
    [visible]="isVisible['projectDevice']"
    label="installations.device-instance.search.project-device"
    [provider]="projectDeviceProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="installations.device-instance.search.order"
    [options]="['', 'SERIAL-NUMBER-ASC', 'SERIAL-NUMBER-DESC']"
  />
</form-layout>
