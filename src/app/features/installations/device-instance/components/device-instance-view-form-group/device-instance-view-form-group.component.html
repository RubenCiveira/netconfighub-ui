<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="projectDevice"
    [visible]="isVisible['projectDevice']"
    label="installations.device-instance.form-group.project-device"
    [provider]="projectDeviceProvider"
  />
  <editable-selectone
    formControlName="model"
    [visible]="isVisible['model']"
    label="installations.device-instance.form-group.model"
    [provider]="modelProvider"
  />
  <editable-text
    formControlName="serialNumber"
    [visible]="isVisible['serialNumber']"
    label="installations.device-instance.form-group.serial-number"
  />
  <editable-upload
    formControlName="modelPhoto"
    [visible]="isVisible['modelPhoto']"
    label="installations.device-instance.form-group.model-photo"
    [download]="downloadModelPhoto"
    [upload]="uploadModelPhoto"
  />
  <editable-upload
    formControlName="serialNumberPhoto"
    [visible]="isVisible['serialNumberPhoto']"
    label="installations.device-instance.form-group.serial-number-photo"
    [download]="downloadSerialNumberPhoto"
    [upload]="uploadSerialNumberPhoto"
  />
  <editable-upload
    formControlName="placementPhoto"
    [visible]="isVisible['placementPhoto']"
    label="installations.device-instance.form-group.placement-photo"
    [download]="downloadPlacementPhoto"
    [upload]="uploadPlacementPhoto"
  />
  <editable-datetime
    formControlName="installedAt"
    [visible]="isVisible['installedAt']"
    label="installations.device-instance.form-group.installed-at"
  />
  <editable-text
    formControlName="installedBy"
    [visible]="isVisible['installedBy']"
    label="installations.device-instance.form-group.installed-by"
  />
</form-layout>
