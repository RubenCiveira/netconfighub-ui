<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="organization.site.search.search" />
  <editable-selectone
    formControlName="clients"
    [visible]="isVisible['clients']"
    label="organization.site.search.clients"
    [provider]="clientsProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.site.search.name" />
  <editable-selectone
    formControlName="client"
    [visible]="isVisible['client']"
    label="organization.site.search.client"
    [provider]="clientProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="organization.site.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
