<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="client"
    [visible]="isVisible['client']"
    label="organization.site.form-group.client"
    [provider]="clientProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.site.form-group.name" />
  <editable-text
    formControlName="address"
    [visible]="isVisible['address']"
    label="organization.site.form-group.address"
  />
</form-layout>
