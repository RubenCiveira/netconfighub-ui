<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.client.form-group.name" />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="organization.client.form-group.enabled"
  />
</form-layout>
