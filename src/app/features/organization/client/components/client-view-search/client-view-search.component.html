<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="organization.client.search.search" />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.client.search.name" />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="organization.client.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
