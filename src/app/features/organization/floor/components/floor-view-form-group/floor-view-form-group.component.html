<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.floor.form-group.name" />
  <editable-selectone
    formControlName="site"
    [visible]="isVisible['site']"
    label="organization.floor.form-group.site"
    [provider]="siteProvider"
  />
  <editable-upload
    formControlName="imagePath"
    [visible]="isVisible['imagePath']"
    label="organization.floor.form-group.image-path"
    [download]="downloadImagePath"
    [upload]="uploadImagePath"
  />
</form-layout>
