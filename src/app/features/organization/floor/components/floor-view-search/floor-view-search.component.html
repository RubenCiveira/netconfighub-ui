<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="organization.floor.search.search" />
  <editable-selectone
    formControlName="site"
    [visible]="isVisible['site']"
    label="organization.floor.search.site"
    [provider]="siteProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="organization.floor.search.name" />
  <editable-selectone
    formControlName="sites"
    [visible]="isVisible['sites']"
    label="organization.floor.search.sites"
    [provider]="sitesProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="organization.floor.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
